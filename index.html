<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Field Playtest</title>
<style>
  :root { --ink: #f3f6ff; --muted: #c3cbef; --panel: rgba(18, 16, 52, .82); --line: rgba(255, 255, 255, .2); --accent: #2ad4ff; --gold: #ffc63d; }
  /* no pinch or double-tap zoom anywhere on the page: a game has no use for it,
     and once zoomed in over the buttons there was no zooming back out */
  html, body { touch-action: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(130% 100% at 50% 0%, #5a4fd0 0%, #33298a 40%, #1a1248 100%);
    -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 3; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; pointer-events: auto; }
  .stat { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
  .stat div small { display: block; color: var(--muted); font-size: 11px; }
  .stat div b { font-size: 20px; }
  #perf { font: 12px/1.45 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre; }
  #controls { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 3; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 12px; }
  button { font: 700 15px/1 inherit; font-family: inherit; color: var(--ink); cursor: pointer;
    background: rgba(255, 255, 255, .1); border: 1px solid var(--line); border-radius: 12px; padding: 13px 18px; }
  button:hover { background: rgba(255, 255, 255, .18); }
  button.go { background: var(--gold); color: #2a1a00; border-color: var(--gold); font-size: 17px; padding: 15px 26px; }
  button[aria-pressed="true"] { background: var(--accent); color: #04151c; border-color: var(--accent); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">Loading the machine…</div>
<div id="hud">
  <div class="card stat">
    <div><small>Coins</small><b id="bank">0</b></div>
    <div><small>Paid out</small><b id="won">0</b></div>
    <div><small>Wheels</small><b><span id="w0" style="color:#ff5468">0</span> <span id="w1" style="color:#ffd23d">0</span> <span id="w2" style="color:#4dff8a">0</span></b></div>
    <div><small>Balls</small><b id="ballsIn" style="color:#5aa8ff">0</b></div>
  </div>
  <div class="card" id="perf"></div>
</div>
<div id="controls">
  <button id="drop" class="go">Drop a coin</button>
  <button id="auto" aria-pressed="false">Keep dropping</button>
  <button id="view">Turn the view</button>
  <button id="testCoins" title="Test: every coin supply shoots out 10 coins - the machine's, not yours">Test coins</button>
  <button id="testBall" title="Test: one ball out of every ball outlet">Test ball</button>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import * as RAPIER from './vendor/rapier.es.js';
import { CFG } from './config.js?v=9';
import { machineFromLayout } from './machine.js?v=9';
import { createField, snapshot, BALL_RADIUS } from './field-physics.js?v=9';
import { createAudio } from './audio.js?v=9';

/* ==================================================================== *
 *  A playtest of the new field.
 *
 *  The machine is built from the block layout (machine.js) and run by
 *  field-physics.js. The field is drawn from the very same parts the
 *  physics uses, so what you see is exactly what the coins hit.
 *
 *  Physics runs at a fixed 30 steps a second, on its own thread
 *  (physics-worker.js) so it has a processor core to itself; the page
 *  only draws, blending the last two steps so motion is smooth at 60 fps.
 *  ?worker=0 runs the physics on the page instead, to compare.
 *  ?freeze=on turns coin freezing on (?mode=speed or creep).
 * ==================================================================== */

const q = new URLSearchParams(location.search);
const HZ = +(q.get('hz') || 30);
const DEG = Math.PI / 180;

/* ---------------- loading ---------------- */

async function json(url) {
  try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; }
}
async function loadLayout() {
  const shipped = await json('machine.json');
  if (!shipped) throw new Error('machine.json is missing.');
  return shipped;
}

const USE_WORKER = q.get('worker') !== '0';
const SIM_OPTS = { hz: HZ, freeze: q.get('freeze') === 'on', freezeMode: q.get('mode') || 'creep' };
const layout = await loadLayout();
const M = machineFromLayout(layout, { stroke: CFG.stroke });
const pile = await json('field-pile.json');

/* ---------------- the scene ---------------- */

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
const scene = new THREE.Scene();

/** A bright room for the metal to reflect, like steel under arcade lights. */
function arcadeRoom() {
  const room = new THREE.Scene();
  room.add(new THREE.Mesh(new THREE.BoxGeometry(100, 50, 100),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0x6a5cc8).multiplyScalar(1.2), side: THREE.BackSide })));
  const panel = (w, h, hex, power, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(power), side: THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); room.add(m);
  };
  panel(80, 60, 0xffffff, 4, [0, 24.5, 0], [Math.PI / 2, 0, 0]);
  panel(60, 20, 0xff4da8, 2.6, [-49.5, 10, 0], [0, Math.PI / 2, 0]);
  panel(60, 20, 0x2ad4ff, 2.6, [49.5, 10, 0], [0, -Math.PI / 2, 0]);
  panel(50, 14, 0xffc63d, 1.8, [0, 12, -49.5], [0, 0, 0]);
  panel(90, 34, 0xffffff, 2.6, [0, 12, 49.5], [0, Math.PI, 0]);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(room, 0.025).texture;
  pm.dispose();
  return tex;
}
scene.environment = arcadeRoom();
scene.add(new THREE.HemisphereLight(0xe4ecff, 0x3a2a78, 0.9));
const key1 = new THREE.DirectionalLight(0xffffff, 1.6); key1.position.set(30, 120, 160); scene.add(key1);

const Mat = o => new THREE.MeshStandardMaterial(o);
const glow = hex => Mat({ color: hex, emissive: hex, emissiveIntensity: 1.4, roughness: 0.4 });
const steel = Mat({ color: 0xc8cdd8, metalness: 0.85, roughness: 0.3 });
const steelSide = Mat({ color: 0xb4bccb, metalness: 0.6, roughness: 0.34 });
const chrome = Mat({ color: 0xeef2f8, metalness: 0.9, roughness: 0.2 });
const cabinet = Mat({ color: 0x2f6fe8, metalness: 0.1, roughness: 0.3, emissive: 0x0d2f8a, emissiveIntensity: 0.55 });
const glassMat = Mat({ color: 0xdff4ff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.06,
  envMapIntensity: 1.6, depthWrite: false, side: THREE.DoubleSide });
const LOOK = {
  deck: [steel, steelSide], ramp: [steel, steelSide], wall: [steel, cabinet],
  catcher: [glow(0xc44bff), glow(0xc44bff)], lip: [glow(0xff3b52), glow(0xff3b52)],
  screen: [glow(0x14b8c4), glow(0x14b8c4)], coinout: [glow(0xff9a3d), glow(0xff9a3d)],
  ballout: [glow(0xff4da8), glow(0xff4da8)], glass: [glassMat, glassMat],
  tray: [Mat({ color: 0x1a1640, metalness: 0.6, roughness: 0.3 }), Mat({ color: 0x1a1640, metalness: 0.6, roughness: 0.3 })],
  chute: [Mat({ color: 0x1d2d63, metalness: 0.3, roughness: 0.4, emissive: 0x0d1a50, emissiveIntensity: 0.6 }),
          Mat({ color: 0x1d2d63, metalness: 0.3, roughness: 0.4, emissive: 0x0d1a50, emissiveIntensity: 0.6 })],
  frame: [Mat({ color: 0x4a5163, metalness: 0.7, roughness: 0.35 }), Mat({ color: 0x4a5163, metalness: 0.7, roughness: 0.35 })],
  pusher: [chrome, chrome],
};

/** A box, with its top in one material and its sides in another. */
function boxMesh(b, kind) {
  const [top, side] = LOOK[kind] ?? LOOK.frame;
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.h[0] * 2, b.h[1] * 2, b.h[2] * 2), [side, side, top, side, side, side]);
  m.position.set(...b.c);
  if (kind === 'glass') m.renderOrder = 2;
  return m;
}

/** A solid from pairs of points - each corner at its bottom, then its top -
 *  which is how machine.js describes a ramp or an odd-shaped block. */
function prismMesh(points, kind) {
  const P = [];
  for (let n = 0; n < points.length; n += 6) P.push([points.slice(n, n + 3), points.slice(n + 3, n + 6)]);
  const pos = [], groups = [];
  const tri = (a, b, c) => pos.push(...a, ...b, ...c);
  const n = P.length;
  for (let t = 1; t < n - 1; t++) tri(P[0][1], P[t + 1][1], P[t][1]);           // top
  const topCount = pos.length / 3;
  for (let t = 1; t < n - 1; t++) tri(P[0][0], P[t][0], P[t + 1][0]);           // bottom
  for (let e = 0; e < n; e++) {                                                  // sides
    const a = P[e], b = P[(e + 1) % n];
    tri(a[0], a[1], b[1]);
    tri(a[0], b[1], b[0]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.addGroup(0, topCount, 0);
  g.addGroup(topCount, pos.length / 3 - topCount, 1);
  g.computeVertexNormals();
  return new THREE.Mesh(g, LOOK[kind] ?? LOOK.frame);
}

for (const s of M.statics) if (s.kind !== 'clip') scene.add(boxMesh(s, s.kind));   // stop blocks are invisible
for (const h of M.hulls) if (h.kind !== 'wheel') scene.add(prismMesh(h.points, h.kind));
for (const r of M.rails) {
  const a = new THREE.Vector3(...r.a), b = new THREE.Vector3(...r.b);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(r.r, r.r, a.distanceTo(b), 16), chrome);
  rod.position.copy(a).add(b).multiplyScalar(0.5);
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  scene.add(rod);
  for (const p of [a, b]) { const cap = new THREE.Mesh(new THREE.SphereGeometry(r.r, 16, 10), chrome); cap.position.copy(p); scene.add(cap); }
}

// the pushers: what you see is the part in front of the wall and above the deck
const pusherGroups = M.pushers.map(p => {
  const g = new THREE.Group();
  for (const b of p.boxes) {
    // the physics body reaches back into the wall and down into the deck,
    // out of sight; draw only the part you would see
    const lo = [b.c[0] - b.h[0], Math.max(b.c[1] - b.h[1], p.bottom), Math.max(b.c[2] - b.h[2], p.back)];
    const hi = [b.c[0] + b.h[0], b.c[1] + b.h[1], b.c[2] + b.h[2]];
    g.add(boxMesh({ c: lo.map((v, i) => (v + hi[i]) / 2), h: lo.map((v, i) => (hi[i] - v) / 2) }, 'pusher'));
  }
  scene.add(g);
  return g;
});

// the drop box's wipers: white rounded bars hanging from their pivots
const wiperMat = Mat({ color: 0xf4f7ff, metalness: 0.1, roughness: 0.25, emissive: 0x9fb4ff, emissiveIntensity: 0.25 });
const guardMeshes = (M.chute ? [0, 1] : []).map(() => {
  const G = M.chute.guards;
  const geo = new THREE.CapsuleGeometry(G.width / 2, G.length - G.width, 6, 14);
  geo.translate(0, -G.length / 2, 0);                  // so it turns about the pivot at its top
  geo.scale(1, 1, (M.chute.gap * 0.8) / G.width);      // flat, to fit the slot
  const m = new THREE.Mesh(geo, wiperMat);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 16), chrome);
  pin.rotation.x = Math.PI / 2;
  m.add(pin);
  scene.add(m);
  return m;
});

// The board under the wipers: chrome pins, and three wheels - red, yellow,
// green - with a channel through the middle. Each lights up as a coin drops
// through it.
const WHEEL_HEX = { red: 0xff3b52, yellow: 0xffd23d, green: 0x3dff7a };
const wheelLook = [];
if (M.chute?.board) {
  const C = M.chute, B = C.board, face = C.scrapeZ;          // the back panel's face
  for (const w of B.wheels) {
    const hex = WHEEL_HEX[w.colour];
    // its face, printed on the panel behind
    const disc = new THREE.Mesh(new THREE.CircleGeometry(w.r + 0.6, 48),
      Mat({ color: new THREE.Color(hex).multiplyScalar(0.45), emissive: hex, emissiveIntensity: 0.12, roughness: 0.8, metalness: 0,
            envMapIntensity: 0.2 }));
    disc.position.set(w.cx, w.cy, face + 0.02);
    const hub = new THREE.Mesh(new THREE.RingGeometry(w.r + 0.6, w.r + 0.95, 48), chrome);
    hub.position.set(w.cx, w.cy, face + 0.03);
    scene.add(disc, hub);
    // the two raised halves either side of the channel, the depth of the slot
    const mat = Mat({ color: hex, emissive: hex, emissiveIntensity: 0.45, metalness: 0.1, roughness: 0.35, envMapIntensity: 0.4 });
    for (const F of w.flat) {
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(F.map(([x, y]) => new THREE.Vector2(x, y))),
                                            { depth: C.gap * 0.95, bevelEnabled: false });
      const m = new THREE.Mesh(geo, mat);
      m.position.z = face;
      scene.add(m);
    }
    wheelLook.push({ disc, mat, lit: 0 });
  }
  for (const p of B.pins) {
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(p.r, p.r, C.gap + 0.3, 14), chrome);
    pin.rotation.x = Math.PI / 2;
    pin.position.set(p.x, p.y, face + C.gap / 2);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(p.r * 1.7, p.r * 1.7, 0.08, 14), chrome);
    head.rotation.x = Math.PI / 2;
    head.position.set(p.x, p.y, face + 0.05);
    scene.add(pin, head);
  }
}
let wheelCounts = [0, 0, 0];

// a cabinet underneath, with strips of light
{
  const B = M.bounds, w = B.hi[0] - B.lo[0] + 4.8, d = B.hi[2] - B.lo[2] + 6, h = 17;
  const base = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    Mat({ color: 0x241a6e, metalness: 0.35, roughness: 0.28, emissive: 0x120a40, emissiveIntensity: 0.5 }));
  base.position.set((B.lo[0] + B.hi[0]) / 2, -h / 2 - 8.05, (B.lo[2] + B.hi[2]) / 2 + 0.6);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.35, d + 0.2),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0x2ad4ff).multiplyScalar(1.5), toneMapped: false }));
  strip.position.set(base.position.x, -8.6, base.position.z);
  scene.add(base, strip);
}

/* ---------------- coins ---------------- */

const MAXC = 1400;                     // the physics' coin pool
const coinMesh = new THREE.InstancedMesh(
  new THREE.CylinderGeometry(CFG.coinR, CFG.coinR, CFG.coinT, 20),
  Mat({ color: 0xdfe3ea, metalness: 0.92, roughness: 0.27, envMapIntensity: 2.2, emissive: 0xdfe3ea, emissiveIntensity: 0.05 }),
  MAXC);
coinMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
coinMesh.frustumCulled = false;
coinMesh.count = 0;
scene.add(coinMesh);

/* The last two physics steps, by coin slot; every frame draws a blend of
 * the two. */
const prevX = new Float32Array(MAXC * 3), curX = new Float32Array(MAXC * 3);
const prevQ = new Float32Array(MAXC * 4), curQ = new Float32Array(MAXC * 4);
const live = new Uint8Array(MAXC), frozenAt = new Uint8Array(MAXC);
let slots = new Int16Array(0), lastStats = null, stateAt = 0, payQueue = 0;

// the big balls, by pool slot: blue and glittery
const MAXB = 24;
const ballMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(BALL_RADIUS, 28, 20),
  Mat({ color: 0x2f7dff, metalness: 0.55, roughness: 0.22, envMapIntensity: 1.8, emissive: 0x0b2f8f, emissiveIntensity: 0.45 }), MAXB);
ballMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ballMesh.frustumCulled = false;
ballMesh.count = 0;
scene.add(ballMesh);
const ballPrev = new Float32Array(MAXB * 7), ballCur = new Float32Array(MAXB * 7);
let ballSlots = [];
let prevPusher = M.pushers.map(() => 0), curPusher = prevPusher.slice(), guards = [];

/** A physics step has arrived: it becomes "now", and "now" becomes "before". */
function onState(m) {
  prevX.set(curX); prevQ.set(curQ);
  const seen = new Uint8Array(MAXC);
  for (let i = 0; i < m.n; i++) {
    const s = m.slots[i], o = i * 7, i3 = s * 3, i4 = s * 4;
    curX[i3] = m.xf[o]; curX[i3 + 1] = m.xf[o + 1]; curX[i3 + 2] = m.xf[o + 2];
    curQ[i4] = m.xf[o + 3]; curQ[i4 + 1] = m.xf[o + 4]; curQ[i4 + 2] = m.xf[o + 5]; curQ[i4 + 3] = m.xf[o + 6];
    if (!live[s]) {                       // just appeared: no streak from wherever it was before
      prevX[i3] = curX[i3]; prevX[i3 + 1] = curX[i3 + 1]; prevX[i3 + 2] = curX[i3 + 2];
      prevQ.set(curQ.subarray(i4, i4 + 4), i4);
    }
    seen[s] = 1;
    frozenAt[s] = m.frozen[i];
  }
  live.set(seen);
  slots = m.slots;
  prevPusher = curPusher; curPusher = m.pushers;
  guards = m.guards;
  lastStats = m.stats;
  ballPrev.set(ballCur);
  const nb = m.balls ? m.balls.length / 8 : 0, seenB = [];
  for (let i = 0; i < nb; i++) {
    const s = m.balls[i * 8], o = s * 7;
    const fresh = !ballSlots.includes(s);
    for (let a = 0; a < 7; a++) ballCur[o + a] = m.balls[i * 8 + 1 + a];
    if (fresh) ballPrev.set(ballCur.subarray(o, o + 7), o);     // just appeared: no streak
    seenB.push(s);
  }
  ballSlots = seenB;
  if (m.stats?.wheels) {
    m.stats.wheels.forEach((n, i) => { if (n > wheelCounts[i] && wheelLook[i]) { wheelLook[i].lit = 1; } });
    wheelCounts = m.stats.wheels.slice();
  }
  payQueue += m.paid;
  stateAt = performance.now();
}

const dummy = new THREE.Object3D();
// ?debug=1 tints frozen coins blue, so freezing and thawing can be watched
const DEBUG = q.get('debug') === '1';
const WHITE = new THREE.Color(1, 1, 1), FROZEN = new THREE.Color(0.35, 0.55, 1.6);
function drawCoins(a) {
  for (let n = 0; n < slots.length; n++) {
    const s = slots[n], i3 = s * 3, i4 = s * 4;
    dummy.position.set(prevX[i3] + (curX[i3] - prevX[i3]) * a, prevX[i3 + 1] + (curX[i3 + 1] - prevX[i3 + 1]) * a,
                       prevX[i3 + 2] + (curX[i3 + 2] - prevX[i3 + 2]) * a);
    let qx = prevQ[i4], qy = prevQ[i4 + 1], qz = prevQ[i4 + 2], qw = prevQ[i4 + 3];
    const cx = curQ[i4], cy = curQ[i4 + 1], cz = curQ[i4 + 2], cw = curQ[i4 + 3];
    if (qx * cx + qy * cy + qz * cz + qw * cw < 0) { qx = -qx; qy = -qy; qz = -qz; qw = -qw; }
    qx += (cx - qx) * a; qy += (cy - qy) * a; qz += (cz - qz) * a; qw += (cw - qw) * a;
    const inv = 1 / (Math.hypot(qx, qy, qz, qw) || 1);
    dummy.quaternion.set(qx * inv, qy * inv, qz * inv, qw * inv);
    dummy.updateMatrix();
    coinMesh.setMatrixAt(n, dummy.matrix);
    if (DEBUG) coinMesh.setColorAt(n, frozenAt[s] ? FROZEN : WHITE);
  }
  coinMesh.count = slots.length;
  coinMesh.instanceMatrix.needsUpdate = true;
  if (DEBUG && coinMesh.instanceColor) coinMesh.instanceColor.needsUpdate = true;
}

/* ---------------- the physics: its own thread, or this page ---------------- */

let sim;
if (USE_WORKER) {
  const worker = new Worker('./physics-worker.js?v=9', { type: 'module' });
  worker.onmessage = e => { if (e.data.type === 'state') onState(e.data); };
  worker.onerror = e => { document.getElementById('perf').textContent = 'physics thread failed: ' + (e.message || e); };
  worker.postMessage({ type: 'init', layout, pile, opts: SIM_OPTS });
  sim = { insert: () => worker.postMessage({ type: 'insert' }), frame() {}, alpha: () => Math.min(1, (performance.now() - stateAt) * HZ / 1000),
          supply: n => worker.postMessage({ type: 'supply', n }), ball: () => worker.postMessage({ type: 'ball' }) };
} else {
  await RAPIER.init();
  const field = createField(RAPIER, M, { ...SIM_OPTS, shape: 'box' });
  if (pile) field.seedFrom(pile);
  let acc = 0, stepMs = 0, paid = 0;
  onState(snapshot(field)[0]);
  sim = {
    insert: () => field.insert(),
    supply: n => field.supply(n),
    ball: () => field.ball(),
    frame(dt) {
      acc += dt;
      const step = field.world.timestep;
      let n = 0;
      const t0 = performance.now();
      while (acc >= step && n < 3) {
        field.step(null, (c, won, k) => { if (won) paid += k || 1; });
        acc -= step;
        n++;
      }
      if (acc > step) acc = step;         // fell behind: drop time rather than spiral
      if (n) {
        stepMs = stepMs * 0.85 + (performance.now() - t0) / n * 0.15;
        onState(snapshot(field, paid, stepMs)[0]);
        paid = 0;
      }
    },
    alpha: () => Math.min(1, acc * HZ),
  };
}

/* ---------------- camera ---------------- */

const camera = new THREE.PerspectiveCamera(40, 1, 1, 6000);
const target = new THREE.Vector3();
let yaw = +(q.get('yaw') || 0), pitch = +(q.get('pitch') || 0.62), dist = 200;
const VIEWS = ['player', 'angle', 'box'];
let view = VIEWS.includes(q.get('view')) ? q.get('view') : 'player';
function fit() {
  if (view === 'box' && M.chute) {
    // close up on the drop box, square on, to watch the wipers
    const C = M.chute;
    target.set(C.xc, (C.topY + C.exitY) / 2 + 3, C.zc);
    yaw = 0; pitch = 0.12;
    dist = (C.topY - C.exitY) * 2.4;
    return;
  }
  if (view === 'angle') { yaw = 0.6; pitch = 0.45; } else if (!q.has('yaw')) { yaw = 0; pitch = +(q.get('pitch') || 0.62); }
  const B = M.bounds, lo = new THREE.Vector3(...B.lo), hi = new THREE.Vector3(...B.hi);
  target.copy(lo).add(hi).multiplyScalar(0.5);
  target.y = lo.y + (hi.y - lo.y) * 0.16;          // a taller machine (a taller drop board) is aimed higher
  target.z += 0.1 * (hi.z - lo.z);
  const r = hi.distanceTo(lo) / 2;
  const half = camera.fov * DEG / 2, hz = Math.atan(Math.tan(half) * camera.aspect);
  dist = r / Math.sin(Math.min(half, hz)) * 0.86;
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fit();
}
addEventListener('resize', resize);
resize();

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.moved) { yaw -= dx * 0.005; pitch = Math.max(0.1, Math.min(1.5, pitch + dy * 0.004)); }
});
addEventListener('pointerup', () => { if (drag && !drag.moved) dropCoin(); drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(30, Math.min(800, dist * (e.deltaY > 0 ? 1.08 : 1 / 1.08))); }, { passive: false });

/* ---------------- playing ---------------- */

let bank = 100, auto = q.get('auto') === '1', nextAuto = 0;
const audio = createAudio();
addEventListener('pointerdown', () => audio.unlock(), { once: false });
// iPhones ignore the page's no-zoom settings for a pinch; this stops it there
for (const type of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(type, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastPhase = 0, simClock = 0;
function dropCoin() {
  if (bank <= 0) return;
  sim.insert();
  bank--;
  audio.drop();
}
document.getElementById('drop').addEventListener('click', e => { e.stopPropagation(); dropCoin(); });
// Test buttons for the outlets. The coin supply's coins are the machine's,
// so nothing comes out of your coins.
document.getElementById('testCoins').addEventListener('click', e => { e.stopPropagation(); sim.supply(10); });
document.getElementById('testBall').addEventListener('click', e => { e.stopPropagation(); sim.ball(); });
// ?fire=1 fires both once, shortly after loading (for testing)
if (q.get('fire') === '1') setTimeout(() => { sim.supply(10); sim.ball(); }, 400);
const autoBtn = document.getElementById('auto');
autoBtn.setAttribute('aria-pressed', String(auto));
autoBtn.addEventListener('click', () => { auto = !auto; autoBtn.setAttribute('aria-pressed', String(auto)); });
document.getElementById('view').addEventListener('click', () => { view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]; fit(); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); dropCoin(); } });


/* ---------------- the loop ---------------- */

let last = 0, fps = 60, frames = 0, fpsT = 0;
const perf = document.getElementById('perf');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  simClock += dt;
  frames++;
  if (now - fpsT > 500) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; report(); }

  if (auto && simClock >= nextAuto) { dropCoin(); nextAuto = simClock + 0.8; }

  sim.frame(dt);
  const a = sim.alpha();
  drawCoins(a);
  ballSlots.forEach((s, n) => {
    const o = s * 7, lerp = k => ballPrev[o + k] + (ballCur[o + k] - ballPrev[o + k]) * a;
    dummy.position.set(lerp(0), lerp(1), lerp(2));
    dummy.quaternion.set(ballCur[o + 3], ballCur[o + 4], ballCur[o + 5], ballCur[o + 6]);
    dummy.updateMatrix();
    ballMesh.setMatrixAt(n, dummy.matrix);
  });
  ballMesh.count = ballSlots.length;
  ballMesh.instanceMatrix.needsUpdate = true;
  if (payQueue) { bank += payQueue; audio.payout(payQueue); payQueue = 0; }
  const phase = (simClock / CFG.period) % 1;
  if (phase < lastPhase || (lastPhase < 0.5 && phase >= 0.5)) audio.clunk();
  lastPhase = phase;
  audio.tick();
  curPusher.forEach((z, i) => { pusherGroups[i].position.z = prevPusher[i] + (z - prevPusher[i]) * a; });
  guards.forEach((at, i) => {
    guardMeshes[i].position.set(at.x, at.y, at.z);
    guardMeshes[i].rotation.set(0, 0, at.ang);
  });
  for (const w of wheelLook) {
    w.lit = Math.max(0, w.lit - dt * 1.4);
    w.mat.emissiveIntensity = 0.45 + w.lit * 2.4;
    w.disc.material.emissiveIntensity = 0.12 + w.lit * 1.6;
  }

  const f = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camera.position.copy(target).addScaledVector(f, -dist);
  camera.lookAt(target);
  renderer.render(scene, camera);
}

function report() {
  document.getElementById('bank').textContent = bank;
  const S = lastStats;
  if (!S) { perf.textContent = 'Starting the physics...'; return; }
  document.getElementById('won').textContent = S.won;
  (S.wheels || []).forEach((n, i) => { document.getElementById('w' + i).textContent = n; });
  document.getElementById('ballsIn').textContent = S.ballsIn ?? 0;
  perf.textContent =
    `${fps.toFixed(0)} fps   physics ${S.stepMs.toFixed(1)} ms a step at ${HZ}/s, ${USE_WORKER ? 'own thread' : 'on the page'}\n` +
    `${S.coins} coins: ${S.moving} moving, ${S.frozen} frozen\n` +
    `lost ${S.lost}   put back ${S.rescues}`;
  document.title = `Field Playtest - ${S.coins} coins, ${S.stepMs.toFixed(1)} ms`;
}

document.getElementById('boot').remove();
requestAnimationFrame(frame);
</script>
</body>
</html>
